<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Финансы</title>
<style>
:root{--bg:#0b0e14;--card:#131722;--ink:#eaecef;--mut:#7d8594;--line:#222838;--acc:#ff5b6e;--exp:#ff5b6e;--inc:#2ebd85;--brand:#f0b90b;--sheet:#171c28;--fill:#1d2331;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}


html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:12px 20px 130px}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.top b{font-size:16px;font-weight:600}
.nav{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:18px;color:var(--mut)}
.hero{padding:22px 2px 8px}
.lb{color:var(--mut);font-size:14px}
.bal{font-size:46px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:4px 0 14px}.chg{display:table;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;margin-bottom:18px}.chg.up{color:var(--inc);background:#2ebd8524}.chg.dn{color:var(--exp);background:#ff5b6e24}
.bal small{font-size:20px;font-weight:500;color:var(--mut);letter-spacing:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two div{font-size:13px;color:var(--mut)}
.two b{display:block;font-size:18px;font-weight:600;color:var(--ink);margin-top:2px}
.d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;font-size:14px;color:var(--mut)}
.ch span{font-size:12px}
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{fill:var(--mut);font-size:10px;font-family:inherit}
.s1{stop-color:var(--acc);stop-opacity:.28}.s2{stop-color:var(--acc);stop-opacity:0}
.lg{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px;border-top:1px solid var(--line)}
.lg:first-of-type{margin-top:14px}
.lg i{width:10px;height:10px;border-radius:50%;flex:none}.row i{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:16px}
.lg span{flex:1}.lg em{font-style:normal;color:var(--mut);font-size:13px}.lg b{font-weight:500;min-width:92px;text-align:right}
.dh{margin:22px 4px 6px;font-size:13px;color:var(--mut)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row span{flex:1;min-width:0}.row b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;font-size:12px;color:var(--mut)}
.row u{text-decoration:none;font-size:15px;font-weight:500}.row u.i{color:var(--inc)}.row u.e{color:var(--exp)}
.empty{text-align:center;padding:90px 12px 0}
.empty h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.empty p{color:var(--mut);margin:0 auto 26px;max-width:290px}
.btn{display:block;width:100%;background:var(--brand);color:#0b0e14;border-radius:14px;padding:15px;font-weight:600}
.lnk{margin-top:14px;color:var(--brand);font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.seg2{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:12px 0;font-size:12px;font-weight:600;color:var(--mut)}
.tab.on{color:var(--brand)}
.fab{position:fixed;right:20px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--brand);color:#0b0e14;display:grid;place-items:center;box-shadow:0 8px 24px #f0b90b44}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--sheet);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;box-sizing:border-box;overscroll-behavior:contain;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:21}
.sh.on{transform:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:14px;padding:3px}
.seg button{padding:9px;border-radius:11px;font-weight:500;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink)}
#amt{width:100%;box-sizing:border-box;border:0;background:none;color:var(--ink);font-family:inherit;font-weight:600;font-size:44px;line-height:1.2;letter-spacing:-.03em;text-align:center;margin:18px 0 4px;outline:none}
#amt.err::placeholder{color:#e5484d}
#amt::placeholder{color:var(--mut)}
.cur{text-align:center;color:var(--mut);font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{padding:8px 14px;border-radius:20px;background:var(--fill);font-size:14px;border:1.5px solid transparent}
.chips button.on{border-color:var(--ink);font-weight:500}
.f{display:flex;gap:10px;margin-bottom:16px}
.f input{flex:1;min-width:0;box-sizing:border-box;border:0;background:var(--fill);color:var(--ink);border-radius:14px;padding:13px 14px;font-family:inherit;font-size:16px;outline:none}
.del{display:block;margin:14px auto 0;color:#e5484d;font-weight:500}.nc{display:none;background:var(--fill);border-radius:14px;padding:12px;margin:-4px 0 14px}.nc.on{display:block}.nc input{width:100%;box-sizing:border-box;border:0;background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:16px;outline:none}.sw{display:flex;gap:10px;margin:12px 0}.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent}.sw button.on{border-color:var(--ink)}.btn.sm{padding:11px;font-size:15px}.chips button.add{border:1.5px dashed var(--mut);color:var(--mut);background:none}.chips b{margin-left:8px;padding:0 2px;color:var(--mut);font-weight:400}.chips button.on{border-color:var(--brand)}.in{display:block;width:100%;box-sizing:border-box;border:0;background:var(--fill);color:var(--ink);border-radius:14px;padding:13px 14px;font-family:inherit;font-size:16px;outline:none;margin-bottom:12px}.st{margin-top:14px}.sr{display:flex;gap:8px;align-items:center;font-size:15px}.sr span{flex:1}.sr b{font-weight:500}.sr em{font-style:normal;color:var(--mut);font-size:12px;min-width:34px;text-align:right}.tr{height:6px;border-radius:4px;background:var(--fill);margin-top:8px;overflow:hidden}.tr div{height:100%;border-radius:4px}.bg{display:block;width:100%;text-align:left;padding:15px 16px;border-top:1px solid var(--line)}.bg:first-child{border-top:0}.bg .lb{font-size:12px;margin-top:6px}.two span{font-size:12px}.fab svg{width:22px;height:22px}.scan{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:12px;border-radius:14px;border:1.5px dashed var(--brand);color:var(--brand);font-weight:600;font-size:15px}.scan svg{width:18px;height:18px}.scan:disabled{opacity:.5}.scs{text-align:center;font-size:13px;color:var(--mut);margin-top:8px}.scs:empty{display:none}textarea.in{resize:none}.btn.alt{background:var(--fill);color:var(--ink)}.tt{pointer-events:none}.tb{fill:var(--ink)}.tx{fill:var(--bg);font-size:11px;font-weight:600;font-family:inherit}.dx{min-width:44px;height:30px;border-radius:9px;color:var(--mut);font-size:18px}.dx.on{color:var(--exp);font-size:13px;padding:0 8px;background:#ff5b6e22}.rp{display:flex;align-items:center;gap:10px;font-size:15px;margin:-4px 0 16px}.rp input{width:20px;height:20px;accent-color:var(--brand)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="nav" data-a="prev" aria-label="Предыдущий месяц">‹</button><b id="mo"></b><button class="nav" data-a="next" aria-label="Следующий месяц">›</button></div>
  <main id="main"></main>
</div>
<nav class="bar">
  <div class="seg2"><button class="tab on" data-a="tab" data-v="home">Главная</button><button class="tab" data-a="tab" data-v="list">Операции</button><button class="tab" data-a="tab" data-v="bud">Бюджет</button><button class="tab" data-a="tab" data-v="ana">Аналитика</button><button class="tab" data-a="tab" data-v="set">Настройки</button></div>
  <button class="fab" data-a="add" aria-label="Добавить операцию"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M11 3v16M3 11h16"/></svg></button>
</nav>
<div class="ov" data-a="close"></div>
<div class="sh" id="gs"><div id="gt0" style="font-size:18px;font-weight:600;margin-bottom:14px"></div><input class="in" id="gn" placeholder="Название цели, например Отпуск" maxlength="30"><input class="in" id="gt" inputmode="decimal" placeholder="Сумма цели"><input class="in" id="ga" inputmode="decimal" placeholder="Уже отложено"><button class="btn" data-a="gsave">Сохранить</button><button class="del" id="gd" data-a="gdel">Удалить цель</button></div>
<div class="sh" id="is"><div style="font-size:18px;font-weight:600;margin-bottom:6px">Импорт из банка</div><div class="lb" style="margin-bottom:12px">Вставьте текст SMS или уведомлений, можно сразу несколько. Или загрузите скриншот операций из банковского приложения.</div><textarea class="in" id="it" rows="4" placeholder="Например: Оплата 23,40 BYN, MILA, карта *1234"></textarea><div style="display:flex;gap:10px"><button class="btn sm alt" style="flex:1" data-a="ipaste">Из буфера</button><button class="btn sm alt" style="flex:1" data-a="ishot">Скриншот</button></div><button class="btn" id="ipb" style="margin-top:12px" data-a="iparse">Распознать</button><div class="scs" id="iss"></div><div id="ir"></div><button class="btn" id="iadd" data-a="iadd" style="display:none;margin-top:12px"></button></div><input type="file" id="ri" accept="image/*" hidden>
<div class="sh" id="bs"><div id="bt" style="font-size:18px;font-weight:600;margin-bottom:14px"></div><input class="in" id="bn" placeholder="Название категории" maxlength="20"><input class="in" id="bl" inputmode="decimal" placeholder="Лимит на месяц, Br"><button class="btn" data-a="bsave">Сохранить</button><button class="del" id="bd" data-a="bdel">Убрать лимит</button><button class="del" id="bdc" data-a="bdc">Удалить категорию</button></div>
<div class="sh" id="sh">
  <div class="seg"><button data-a="seg" data-t="e">Расход</button><button data-a="seg" data-t="i">Доход</button></div>
  <button class="scan" id="scan" data-a="scan" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Сканировать чек</button><button class="scan" id="imp" data-a="imp" style="display:none;margin-top:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Из банка: SMS или скриншот</button><input type="file" id="rc" accept="image/*" hidden><div class="scs" id="scs"></div>
  <input id="amt" inputmode="decimal" placeholder="0,00" autocomplete="off">
  <div class="cur">белорусских рублей, Br</div>
  <div class="chips" id="cats"></div>
  <div class="nc" id="nc"><input id="ncn" placeholder="Название категории" maxlength="20"><div class="sw" id="sw"></div><button class="btn sm" data-a="addcat">Добавить категорию</button></div>
  <div class="f"><input id="dt" type="date"><input id="nt" placeholder="Заметка" maxlength="60"></div><label class="rp" id="rpl"><input type="checkbox" id="rp"> Повторять каждый месяц</label>
  <button class="btn" data-a="save">Сохранить</button>
  <button class="del" id="del" data-a="del">Удалить операцию</button>
</div>
<script>
const CATS={e:[['food','Продукты','#4c6ef5'],['tr','Транспорт','#15aabf'],['cafe','Кафе','#f59f00'],['home','Жильё','#7950f2'],['hl','Здоровье','#e64980'],['fun','Развлечения','#f76707'],['shop','Покупки','#12b886'],['oth','Другое','#868e96']],
i:[['sal','Зарплата','#12a37f'],['side','Подработка','#15aabf'],['oth','Другое','#868e96']]};
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MNE=['January','February','March','April','May','June','July','August','September','October','November','December'],MSE=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNX=()=>S.st.lang=='en'?MNE:MN,MSX=()=>S.st.lang=='en'?MSE:MS;
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const LOC=()=>S.st.lang=='en'?'en-US':'ru-RU';
const nf={format:n=>n.toLocaleString(LOC(),{minimumFractionDigits:2,maximumFractionDigits:2})};
const CURS=[['BYN','Br','белорусских рублей','Belarusian rubles'],['USD','$','долларов США','US dollars'],['EUR','€','евро','euros'],['RUB','₽','российских рублей','Russian rubles'],['PLN','zł','польских злотых','Polish zloty'],['UAH','₴','украинских гривен','Ukrainian hryvnia']];
const CUR=()=>CURS.find(c=>c[0]==S.st.cur)||CURS[0];
const fmt=n=>nf.format(n)+'\u00a0'+CUR()[1];
const big=n=>{const [i,f]=Math.abs(n).toFixed(2).split('.');return (n<0?'−':'')+Number(i).toLocaleString(LOC())+`<small>${S.st.lang=='en'?'.':','}${f}\u00a0${CUR()[1]}</small>`};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=t=>{const b=CATS[t],h=S.st.hid[t]||[];return [...b.slice(0,-1),...(S.cx[t]||[]),b[b.length-1]].filter(c=>!h.includes(c[0]))};
const cat=(t,c)=>{const l=list(t);return l.find(x=>x[0]==c)||l[l.length-1]};
const sum=(tx,t)=>tx.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0);
const LS='fin-v1';
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function loadSt(){try{const x=JSON.parse(localStorage.getItem('fin-st')||'{}'),h=x.hid||{};return{cur:x.cur||'BYN',lang:x.lang||'ru',hid:{e:h.e||[],i:h.i||[]},rc:x.rc||[],gl:x.gl||[]}}catch(e){return{cur:'BYN',lang:'ru',hid:{e:[],i:[]},rc:[],gl:[]}}}
function loadBd(){try{return JSON.parse(localStorage.getItem('fin-bd')||'{}')}catch(e){return{}}}
function loadCats(){try{return Object.assign({e:[],i:[]},JSON.parse(localStorage.getItem('fin-cx')||'{}'))}catch(e){return{e:[],i:[]}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S.tx));localStorage.setItem('fin-cx',JSON.stringify(S.cx));localStorage.setItem('fin-bd',JSON.stringify(S.bd));localStorage.setItem('fin-st',JSON.stringify(S.st))}catch(e){}}
const now=new Date();
const S={tx:loadLocal(),cx:loadCats(),bd:loadBd(),st:loadSt(),f:'all',mo:{y:now.getFullYear(),m:now.getMonth()},v:'home'};
let dbDoc=null,busy=false,dirty=false;
async function pushDb(){if(!dbDoc)return;if(busy){dirty=true;return}busy=true;try{await dbDoc.set({tx:S.tx,cats:S.cx,bud:S.bd,st:S.st})}catch(e){}busy=false;if(dirty){dirty=false;pushDb()}}
function persist(){saveLocal();pushDb()}
async function initDb(){try{
  if(!window.claude||!claude.use)return;
  const [u,db]=await Promise.all([claude.use('user'),claude.use('db')]);
  if(!u||!db)return;
  const id=await u.id(),ref=db.doc('data/users/'+id+'/state'),snap=await ref.get();
  if(snap.exists){const dd=snap.data();S.tx=(dd.tx||[]).map(x=>({...x}));if(dd.cats)S.cx={e:(dd.cats.e||[]).map(x=>[...x]),i:(dd.cats.i||[]).map(x=>[...x])};if(dd.bud)S.bd={...dd.bud};if(dd.st){const h=dd.st.hid||{};S.st={cur:dd.st.cur||'BYN',lang:dd.st.lang||'ru',hid:{e:[...(h.e||[])],i:[...(h.i||[])]},rc:(dd.st.rc||[]).map(o=>({...o})),gl:(dd.st.gl||[]).map(o=>({...o}))}};saveLocal()}
  else if(S.tx.length||S.cx.e.length||S.cx.i.length){await ref.set({tx:S.tx,cats:S.cx,bud:S.bd,st:S.st})}
  dbDoc=ref;applyRc();applyLang();
}catch(e){}}
function mtx(){const pre=`${S.mo.y}-${p2(S.mo.m+1)}`;return S.tx.filter(t=>t.d.startsWith(pre))}

function lineChart(tx){
  const {y,m}=S.mo,dim=new Date(y,m+1,0).getDate(),cur=now.getFullYear()==y&&now.getMonth()==m,end=cur?now.getDate():dim;
  const day=Array(dim+1).fill(0);tx.filter(t=>t.t=='e').forEach(t=>day[+t.d.slice(8)]+=t.a);
  let acc=0;const pts=[];for(let d=1;d<=end;d++){acc+=day[d];pts.push(acc)}
  const max=Math.max(acc,1),W=320,H=100,x=d=>(d-1)/(dim-1)*W,yv=v=>H-6-v/max*(H-18);
  const line=smooth(pts.map((v,i)=>[x(i+1),yv(v)]));
  const lx=x(pts.length).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H+16}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
  <path d="M0 ${yv(max/2).toFixed(1)}H${W}M0 ${yv(max).toFixed(1)}H${W}" stroke="var(--line)" stroke-dasharray="3 4" fill="none"/><text x="0" y="${(yv(max)-5).toFixed(1)}" class="ax">${acc?Math.round(max).toLocaleString(LOC())+'\u00a0Br':''}</text><path d="${line}L${lx} ${H}L0 ${H}Z" fill="url(#g)"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="${lx}" cy="${yv(acc).toFixed(1)}" r="4" fill="var(--acc)"/><text x="0" y="${H+14}" class="ax">1</text><text x="${W}" y="${H+14}" class="ax" text-anchor="end">${dim}</text>${pts.map((v,i)=>`<circle cx="${x(i+1).toFixed(1)}" cy="${yv(v).toFixed(1)}" r="1.8" fill="var(--acc)" opacity=".55"/><circle cx="${x(i+1).toFixed(1)}" cy="${yv(v).toFixed(1)}" r="5" fill="transparent" style="cursor:pointer" data-tip="${i+1} ${MSX()[m]}: ${fmt(v)}" data-x="${x(i+1).toFixed(1)}" data-y="${yv(v).toFixed(1)}" data-c="var(--acc)"/>`).join('')}</svg>`;
}
function donut(tx,full){
  const by={};tx.filter(t=>t.t=='e').forEach(t=>by[t.c]=(by[t.c]||0)+t.a);
  const tot=Object.values(by).reduce((a,b)=>a+b,0);
  if(!tot)return '<div class="lb">В этом месяце расходов нет</div>';

  const tp=e.target.closest('[data-tip]');if(tp){tip(tp);return}
  document.querySelectorAll('.tt').forEach(n=>n.remove());
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='prev'||a=='next'){const d=new Date(S.mo.y,S.mo.m+(a=='next'?1:-1),1);S.mo={y:d.getFullYear(),m:d.getMonth()};render()}
  else if(a=='tab'){S.v=b.dataset.v;render();scrollTo(0,0)}
  else if(a=='add')openSheet();
  else if(a=='edit')openSheet(b.dataset.id);
  else if(a=='close')closeSheet();
  else if(a=='seg'){ed.t=b.dataset.t;ed.c=list(ed.t)[0][0];drawSheet()}
  else if(a=='cat'){ed.c=b.dataset.c;drawSheet()}
  else if(a=='newcat'){$('#nc').classList.toggle('on');$('#ncn').focus()}
  else if(a=='sw'){ncc=b.dataset.c;drawSheet()}
  else if(a=='addcat'){const n=$('#ncn').value.trim();if(!n){$('#ncn').focus();return}const k='c'+uid();(S.cx[ed.t]=S.cx[ed.t]||[]).push([k,n,ncc]);ed.c=k;$('#ncn').value='';$('#nc').classList.remove('on');persist();drawSheet()}
  else if(a=='rmcat'){delCat(ed.t,b.dataset.c);drawSheet();render()}
  else if(a=='save')save();
  else if(a=='del'){S.tx=S.tx.filter(t=>t.id!=ed.id);persist();closeSheet();render()}
  else if(a=='demo')demo();
  else if(a=='flt'){S.f=b.dataset.f;render()}
  else if(a=='bud')openBud(b.dataset.c);
  else if(a=='bnew')openBud(null);
  else if(a=='bsave')saveBud();
  else if(a=='bdel'){delete S.bd[bk];persist();closeSheet();render()}
  else if(a=='scan')$('#rc').click();
  else if(a=='cur'){S.st.cur=b.dataset.c;persist();applySet();render()}
  else if(a=='lang'){S.st.lang=b.dataset.c;persist();applyLang()}
  else if(a=='delcat'){const k=b.dataset.t+b.dataset.c;if(arm==k){arm='';delCat(b.dataset.t,b.dataset.c);render()}else{arm=k;render();setTimeout(()=>{if(arm==k){arm='';render()}},3500)}}
  else if(a=='rest'){S.st.hid={e:[],i:[]};persist();render()}
  else if(a=='bdc'){delCat('e',bk);closeSheet();render()}
  else if(a=='goal')openGoal(b.dataset.id);
  else if(a=='gnew')openGoal(null);
  else if(a=='gsave')saveGoal();
  else if(a=='gdel'){S.st.gl=S.st.gl.filter(x=>x.id!=gk);persist();closeSheet();render()}
  else if(a=='advice')getAdvice();
  else if(a=='rcdel'){const k='rc'+b.dataset.id;if(arm==k){arm='';S.st.rc=S.st.rc.filter(r=>r.id!=b.dataset.id);persist();render()}else{arm=k;render();setTimeout(()=>{if(arm==k){arm='';render()}},3500)}}
  else if(a=='imp')openImp();
  else if(a=='ipaste')pasteClip();
  else if(a=='ishot')$('#ri').click();
  else if(a=='iparse')parseImp(null);
  else if(a=='itog'){const x=imp[+b.dataset.i];x.on=!x.on;drawImp()}
  else if(a=='iadd'){const o=imp.filter(x=>x.on);if(!o.length)return;o.forEach(x=>S.tx.push({id:uid(),t:x.t,c:x.c,a:x.a,d:x.d,n:x.n}));const d=o.map(x=>x.d).sort().pop();S.mo={y:+d.slice(0,4),m:+d.slice(5,7)-1};persist();closeSheet();render()}
});
$('#amt').addEventListener('input',e=>e.target.classList.remove('err'));
applyRc();applyLang();initDb();initScan();
new MutationObserver(ms=>{if(S.st.lang!='en')return;ms.forEach(m=>{if(m.type=='characterData')trNode(m.target);m.addedNodes.forEach(trNode)})}).observe(document.body,{childList:true,subtree:true,characterData:true});
</script>
</body>
</html>
